name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy portfolio images
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --output assets/vivaan-portrait.png "https://vivaan-khajuria.vivaankhajuria854.chatgpt.site/assets/vivaan-portrait.png"
          curl --fail --location --retry 3 --output assets/red-mecha.png "https://vivaan-khajuria.vivaankhajuria854.chatgpt.site/assets/red-mecha.png"
          curl --fail --location --retry 3 --output assets/ink-beast.png "https://vivaan-khajuria.vivaankhajuria854.chatgpt.site/assets/ink-beast.png"
          file assets/*.png
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
